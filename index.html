  .toprule { height: 6px; background: #e10600; }

  .eyebrow { color: var(--dim); font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 18px; margin: 8px 0 0; line-height: 1.3; font-style: italic; }
  .pillrow { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; scrollbar-width: none; }
  .pillrow::-webkit-scrollbar { display: none; }
  .pill { border: 2px solid #111; background: transparent; color: var(--text); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-family: Rokkitt, serif; font-weight: 800; letter-spacing: -0.01em; text-transform: none; white-space: nowrap; }

  main { padding: 8px 16px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 0; padding: 14px; margin-bottom: 10px; }

  .card.tap:active { background: #161412; }
  .row { display: flex; align-items: center; gap: 10px; }
  .av { width: 40px; height: 40px; border-radius: 0; display: grid; place-items: center; font-family: Rokkitt, serif; font-weight: 800; font-size: 18px; flex: none; background: #e10600; color: #f6f0e6; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-family: Rokkitt, serif; font-size: 20px; font-weight: 800; }
  .who small { color: var(--dim); font-size: 12px; font-family: "JetBrains Mono", monospace; letter-spacing: .04em; }
  .grade { width: 42px; height: 42px; border-radius: 0; display: grid; place-items: center; font-family: Rokkitt, serif; font-weight: 800; font-size: 22px; flex: none; border: 1px solid var(--line); }
  .gA { background: var(--green-dim); color: var(--green); }
  .gB { background: transparent; color: var(--text); }
  .gC { background: var(--amber-dim); color: var(--coral); }
  .gD, .gF { background: var(--red-dim); color: var(--red); }
  .g– { background: transparent; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: transparent; border-top: 1px solid var(--line); border-radius: 0; padding: 8px 0 0; }
  .stat em { display: block; font-style: normal; color: var(--dim); font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
  .stat strong { font-family: Rokkitt, serif; font-size: 18px; font-weight: 800; }
  .flag { display: inline-block; font-family: "JetBrains Mono", monospace; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; border-radius: 0; padding: 3px 7px; margin: 8px 6px 0 0; border: 1px solid var(--line); }
  .flag.bad { color: var(--red); border-color: var(--red); }
  .flag.warn { color: var(--coral); border-color: var(--coral); }

  .metric { margin-bottom: 10px; }

  .metric .top span { color: var(--muted); font-family: "JetBrains Mono", monospace; font-size: 12px; }
  .tl { border-left: 1px solid var(--line); margin-left: 8px; padding-left: 14px; }
  .ev { position: relative; margin: 0 0 14px; }

  .ev.buy::before { background: var(--green); }
  .ev.sell::before { background: var(--red); }

function tally(handle) {

function scoreCall(c) {
  let skin = 0, hold = 0, dump = 100, disc = c.disclosed ? 100 : 15;
  if (!c.hadBag) skin = 0;
  else if (c.buyBeforeHours == null) skin = 40;
  else if (c.buyBeforeHours >= 6) skin = 100;
  else if (c.buyBeforeHours >= 0) skin = 75;
  else skin = 25; // bought after the post, or allocation only
  if (c.sizeEth >= 0.3) skin = Math.min(100, skin + 8);
  if (c.soldWithinHours == null) { hold = Math.min(100, 60 + c.holdDays * 2); dump = 100; }
  else if (c.soldWithinHours <= 1) { hold = 0; dump = 0; }
  else if (c.soldWithinHours <= 24) { hold = 20; dump = 15; }
  else if (c.soldWithinHours <= 72) { hold = 45; dump = 40; }
  else { hold = 70; dump = 75; }
  if (c.cluster) dump = Math.min(dump, 20);

function accusationHit(k) {
  const n = k.accusations || 0;

}
function artHit(k) {
  const artKols = new Set(["garyvee", "beeple", "punk6529", "DeeZe", "pranksy", "frankdegods", "CozomoMedici", "farokh", "punk9059", "LucaNetz", "gmoneyNFT", "Zeneca", "osf", "XCOPYART", "dingalingts", "Tma_420", "eyezenhour", "lofitheyeti"]);

  if (k.artPattern || (k.support || 0) >= 3) return 0;

}
function voteHit(k) {
  const t = tally(k.handle);

  if (t.like >= 60) return -Math.min(4, Math.round((t.like - 50) / 12));
  if (t.like <= 40) return Math.min(4, Math.round((50 - t.like) / 12));

}
function gradeKol(k) {
  const hit = accusationHit(k) + artHit(k) + voteHit(k);
  if (!k.calls || !k.calls.length) {
    if (!hit && !(k.wallet && !String(k.wallet).startsWith("no "))) return { score: null, letter: "–", label: "Unscored", skin: 0, hold: 0, dump: 0, disc: 0, wallet: 0, flags: [["No matched fills", "warn"]] };
    const score = 88 - hit;
    const letter = score >= 80 ? "B" : "C";
    return { score, letter, label: "Incomplete", skin: 0, hold: 0, dump: 0, disc: 0, wallet: 0, flags: [["No matched fills", "warn"], ["Accusations capped at 6", "warn"], ["No public 1/1 buy costs 6", "warn"]] };
  }
  const parts = k.calls.map(scoreCall);
  const avg = (key) => parts.reduce((s, p) => s + p[key], 0) / parts.length;
  const skin = avg("skin");
  const hold = avg("hold");
  const dump = avg("dump");
  const disc = avg("disc");
  const wallet = k.verified ? (k.cluster ? 30 : 90) : 10;
  const audience = k.handle === "ghostbag" ? 25 : 70;
  let score = skin * 0.22 + hold * 0.25 + dump * 0.23 + disc * 0.12 + wallet * 0.12 + audience * 0.06;
  const flags = [];
  const fastDump = k.calls.filter(c => c.soldWithinHours != null && c.soldWithinHours <= 24).length / k.calls.length;
  if (fastDump >= 0.5) { score = Math.min(score, 58); flags.push(["Sold inside 24h of post", "bad"]); }
  if (!k.verified) { score = Math.min(score, 72); flags.push(["Wallet unsigned", "warn"]); }
  if (k.cluster) { score = Math.min(score, 64); flags.push(["Shared funder cluster", "bad"]); }
  const undisclosed = k.calls.filter(c => !c.disclosed).length / k.calls.length;
  if (undisclosed > 0.5 && fastDump >= 0.5) { score = Math.min(score, 42); flags.push(["Undisclosed + dump", "bad"]); }
  if (k.calls.every(c => c.disclosed) && k.verified) flags.push(["Discloses", "good"]);
  if (k.calls.some(c => c.buyBeforeHours >= 6 && c.soldWithinHours == null)) flags.push(["Buys before posting", "good"]);
  if (k.prix) flags.push(["Prixville bag", "good"]);
  score = Math.round(clamp(score - accusationHit(k) - artHit(k) - voteHit(k), 0, 100));
  const letter = score >= 90 ? "A" : score >= 80 ? "B" : score >= 65 ? "C" : score >= 50 ? "D" : "F";
  const label = { A: "Aligned", B: "Credible", C: "Mixed", D: "Conflicted", F: "Extractor" }[letter];
  return { score, letter, label, skin: Math.round(skin), hold: Math.round(hold), dump: Math.round(dump), disc: Math.round(disc), wallet, flags };
}

        ["Cabal graph", "Shared funder, same-block buys, posts within 5 minutes. One grade for the cluster."],
        ["Deleted post log", "Shills that vanish after the chart dies stay on the dossier."],
        ["Signed challenge", "KOL signs a message to claim a wallet. Stall means the grade stays capped."],
        ["Audience wallets", "What share of followers can even transact. Catches bought followers."],
        ["Damage score", "Median result for wallets that bought within 2h of the post."],
        ["Prixville desk", "Alert only on mentions or buys of your collection, min grade B, bought-first."],
        ["Dispute", "They can sign and attach the tx. The timeline updates. The grade does not get a manual override."]
      ].map(i => `<div class="idea"><div><div class="tag">Add</div><b>${i[0]}</b><p class="note" style="margin:2px 0 0">${i[1]}</p></div></div>`).join("")}
    </div>
    <h3>Stack</h3>
    <ul class="clean">
      <li>API: small Node service, Postgres for dossiers and events.</li>
      <li>Chains: Reservoir or OpenSea activity on ETH/Base. Helius on Solana.</li>
      <li>Social: X recent search on a fixed handle list. You already run Premium accounts.</li>
      <li>Bot: discord.js, slash commands, one channel for red and one for green.</li>
      <li>Apps: Capacitor iOS + Android around this UI. Push via the same alert rules.</li>
    </ul>`;
}

function draw() {
  renderFilters();
  const root = document.getElementById("app");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (tab === "board") {
    root.innerHTML = open ? dossier(GRADED.find(k => k.handle === open)) : board();
    if (open) {
      document.getElementById("back").onclick = () => { open = null; draw(); };
      bindVotes(open);
      bindWallet(open);
    }
    root.querySelectorAll("[data-h]").forEach(el => el.onclick = () => { open = el.dataset.h; tab = "board"; draw(); });
  } else if (tab === "crowd") {
    root.innerHTML = crowd();
    root.querySelectorAll("[data-h]").forEach(el => el.onclick = () => { open = el.dataset.h; tab = "board"; draw(); });
  } else if (tab === "alerts") { document.getElementById("count").textContent = ""; root.innerHTML = alerts(); }
  else if (tab === "method") { document.getElementById("count").textContent = ""; root.innerHTML = method(); }
  else { document.getElementById("count").textContent = ""; root.innerHTML = build(); }
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; open = null; draw(); });
draw();
</script>
</body>
</html>
